<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="juwookim — 만들면서 배우는 주니어 개발자">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>

  <!-- maze -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4" stroke-linecap="round">
    <path d="M760 40 H1000 V88 M808 40 V136 H904 M952 88 V184 H856 M1000 136 H1048 V232 M760 88 V232 H808 M808 184 V280 M904 232 H1000 V280"/>
  </g>

  <!-- snake -->
  <g fill="#5eead4">
    <rect x="1060" y="52" width="20" height="20" rx="4" fill-opacity="0.35"/>
    <rect x="1084" y="52" width="20" height="20" rx="4" fill-opacity="0.5"/>
    <rect x="1108" y="52" width="20" height="20" rx="4" fill-opacity="0.65"/>
    <rect x="1108" y="76" width="20" height="20" rx="4" fill-opacity="0.8"/>
    <rect x="1108" y="100" width="20" height="20" rx="4"/>
    <circle cx="1118" cy="160" r="7" fill="#fca5a5"/>
  </g>

  <!-- text -->
  <text x="72" y="108" fill="#c7d2fe" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="22" letter-spacing="1">&lt;hello world /&gt;</text>
  <text x="68" y="178" fill="#ffffff" font-family="'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="72" font-weight="800" letter-spacing="-1">juwookim</text>
  <rect x="72" y="198" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="246" fill="#e0e7ff" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Segoe UI', sans-serif" font-size="26" font-weight="500">만들면서 배우는 주니어 개발자 · Web · Game · Mobile</text>
</svg>
